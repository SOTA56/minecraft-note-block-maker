  <body><div id="root"></div><script>
    (()=>{
      const retryKey='otoblogic:startup-recovery-attempted-v2'
      const activeModule=()=>document.querySelector('script[type="module"][src]')?.getAttribute('src')||''
      const showRecovery=()=>{
        if(document.getElementById('otoblogic-recovery'))return
        const panel=document.createElement('div')
        panel.id='otoblogic-recovery'
        panel.style.cssText='position:fixed;z-index:2147483647;inset:0;display:grid;place-items:center;padding:24px;background:#090d0b;color:#f1f3ef;font:16px system-ui,sans-serif;text-align:center'
        panel.innerHTML='<div><p style="margin:0 0 18px;line-height:1.7">ページを更新しています。<br>表示されない場合は、下のボタンを押してください。</p><button style="min-width:180px;min-height:48px;border:1px solid #37a9e9;background:#15394d;color:#b8e7ff;font:700 14px system-ui,sans-serif">再読み込み</button></div>'
        panel.querySelector('button').addEventListener('click',()=>reloadFresh(true))
        document.body.appendChild(panel)
      }
      const reloadFresh=force=>{
        if(document.documentElement.dataset.appReady==='true')return
        const url=new URL(location.href)
        // An automatic recovery must happen at most once.  A time based
        // cooldown used to start another reload every 30 seconds when a
        // browser retained stale deployment assets, creating an endless
        // __refresh loop instead of leaving the user a usable retry button.
        if(!force&&(url.searchParams.has('__refresh')||sessionStorage.getItem(retryKey)==='1')){
          showRecovery()
          return
        }
        const now=Date.now()
        sessionStorage.setItem(retryKey,'1')
        url.searchParams.set('__refresh',String(now))
        location.replace(url.href)
      }
      const failedAsset=event=>{
        const target=event.target
        if(target instanceof HTMLScriptElement||(target instanceof HTMLLinkElement&&['stylesheet','modulepreload'].includes(target.rel)))reloadFresh(false)
      }
      const failedModule=event=>{
        const message=String(event.reason?.message||event.reason||'')
        if(/module|chunk|import|fetch/i.test(message))reloadFresh(false)
      }
      const checkCurrentBuild=async()=>{
        if(document.visibilityState==='hidden')return
        try{
          const response=await fetch(location.pathname,{cache:'no-store',headers:{'Cache-Control':'no-cache'}})
          if(!response.ok)return
          const html=await response.text()
          const next=html.match(/<script[^>]+type=["']module["'][^>]+src=["']([^"']+)/)?.[1]||html.match(/<script[^>]+src=["']([^"']+)["'][^>]+type=["']module/)?.[1]||''
          const current=activeModule()
          if(next&&current&&next!==current){
            document.documentElement.dataset.appReady='false'
            reloadFresh(false)
          }
        }catch{ /* A temporary network failure should not interrupt the open app. */ }
      }
      window.addEventListener('error',failedAsset,true)
      window.addEventListener('unhandledrejection',failedModule)
      window.addEventListener('pageshow',event=>{if(event.persisted)void checkCurrentBuild()})
      document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')void checkCurrentBuild()})
      // Slow devices and slow networks are not necessarily stale builds.
      // Only a confirmed script/style failure may trigger an automatic
      // cache-busting reload; a startup timeout merely offers a manual retry.
      window.setTimeout(()=>{if(document.documentElement.dataset.appReady!=='true')showRecovery()},12000)
    })()
  </script><script type="module" src="/src/main.tsx"></script></body>
